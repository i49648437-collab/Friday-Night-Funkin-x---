<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Night Funkin' x Аля - Полная Версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        /* Splash Screen */
        #splashScreen {
            background: radial-gradient(circle, #2a2a4a 0%, #1a1a2e 100%);
            z-index: 100;
        }

        #splashLogo {
            font-size: 72px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff;
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 20px;
        }

        #splashSubtitle {
            font-size: 24px;
            color: #ff69b4;
            text-shadow: 0 0 20px #ff69b4;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Main Menu */
        #mainMenu {
            background: url('фон меню.png') no-repeat center center;
            background-size: cover;
            z-index: 90;
        }

        #menuTitle {
            font-size: 80px;
            font-weight: bold;
            color: #ff1493;
            text-shadow: 4px 4px 0 #000, 0 0 50px #ff1493;
            margin-bottom: 60px;
            animation: titleBounce 1s ease-in-out infinite;
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .menuButtons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menuButton {
            width: 300px;
            padding: 20px 40px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            border: 4px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px #000;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.5);
        }

        .menuButton:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.8);
            background: linear-gradient(45deg, #ff69b4, #ff1493);
        }

        .menuButton:active {
            transform: scale(0.95);
        }

        .menuButton.selected {
            background: linear-gradient(45deg, #00ffff, #00ffaa);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.8);
        }

        /* Story Mode Menu */
        #storyModeMenu {
            background: rgba(0, 0, 0, 0.9);
            z-index: 80;
        }

        .songList {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
            max-height: 400px;
            overflow-y: auto;
        }

        .songItem {
            width: 400px;
            padding: 20px;
            font-size: 24px;
            color: #fff;
            background: linear-gradient(90deg, transparent, rgba(255, 20, 147, 0.3), transparent);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .songItem:hover, .songItem.selected {
            background: linear-gradient(90deg, transparent, rgba(255, 20, 147, 0.6), transparent);
            border-color: #ff1493;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.5);
        }

        /* Game Screen */
        #gameScreen {
            background: transparent;
            z-index: 70;
            justify-content: flex-start;
            padding-top: 0;
        }

        /* HUD Elements */
        #scoreDisplay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }

        #comboDisplay {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #comboDisplay.visible {
            opacity: 1;
        }

        #healthBar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 30px;
            background: #333;
            border: 4px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            z-index: 10;
        }

        #healthFill {
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00);
            transition: width 0.1s ease;
            position: relative;
        }

        #healthIcon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            border: 3px solid #000;
            transition: left 0.1s ease;
        }

        #accuracyDisplay {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }

        #pauseOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #pauseTitle {
            font-size: 64px;
            color: #fff;
            text-shadow: 0 0 30px #fff;
            margin-bottom: 40px;
        }

        .pauseButtons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .pauseButton {
            width: 250px;
            padding: 15px 30px;
            font-size: 24px;
            color: #fff;
            background: linear-gradient(45deg, #4a4a6a, #6a6a8a);
            border: 3px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pauseButton:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, #6a6a8a, #4a4a6a);
        }

        /* Results Screen */
        #resultsScreen {
            background: rgba(0, 0, 0, 0.95);
            z-index: 110;
        }

        #resultTitle {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 40px;
            animation: resultPulse 1s ease-in-out infinite;
        }

        .win {
            color: #00ff00;
            text-shadow: 0 0 50px #00ff00;
        }

        .lose {
            color: #ff0000;
            text-shadow: 0 0 50px #ff0000;
        }

        @keyframes resultPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .statBox {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        .statLabel {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .statValue {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
        }

        #grade {
            font-size: 120px;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 50px currentColor;
        }

        .grade-S { color: #ffd700; }
        .grade-A { color: #00ff00; }
        .grade-B { color: #00ffff; }
        .grade-C { color: #ffff00; }
        .grade-D { color: #ff8800; }
        .grade-F { color: #ff0000; }

        /* Loading Screen */
        #loadingScreen {
            background: #000;
            z-index: 120;
        }

        #loadingBar {
            width: 400px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        #loadingFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff1493, #00ffff);
            transition: width 0.3s ease;
        }

        #loadingText {
            color: #fff;
            font-size: 24px;
            margin-top: 10px;
        }

        /* Character Sprites */
        .character {
            position: absolute;
            bottom: 150px;
            width: 300px;
            height: 400px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.1s ease;
        }

        #boyfriend {
            left: 100px;
        }

        #girlfriend {
            left: 50%;
            transform: translateX(-50%);
            bottom: 100px;
            width: 250px;
            height: 350px;
        }

        #opponent {
            right: 100px;
            transform: scaleX(-1);
        }

        /* Note Arrows */
        .noteArrow {
            position: absolute;
            width: 60px;
            height: 60px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 5;
        }

        .strumArrow {
            position: absolute;
            width: 60px;
            height: 60px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 6;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
        }

        .hitEffect {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            animation: hitExpand 0.2s ease-out forwards;
            z-index: 7;
        }

        @keyframes hitExpand {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Rating Text */
        .ratingText {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            animation: ratingFloat 0.5s ease-out forwards;
            z-index: 8;
        }

        @keyframes ratingFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }

        .rating-sick { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
        .rating-good { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
        .rating-bad { color: #ffff00; text-shadow: 0 0 20px #ffff00; }
        .rating-shit { color: #ff0000; text-shadow: 0 0 20px #ff0000; }

        /* Volume Controls */
        .volumeControl {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        .volumeSlider {
            width: 100px;
            height: 10px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 5px;
            outline: none;
        }

        .volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ff1493;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Settings Panel */
        #settingsPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 4px solid #ff1493;
            z-index: 100;
            display: none;
        }

        #settingsPanel.active {
            display: block;
        }

        .settingRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .settingLabel {
            color: #fff;
            font-size: 20px;
        }

        .settingToggle {
            width: 60px;
            height: 30px;
            background: #333;
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .settingToggle.on {
            background: #00ff00;
        }

        .settingToggle::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .settingToggle.on::after {
            transform: translateX(30px);
        }

        /* Particles */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 20;
        }

        /* CRT Effect */
        #crtEffect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 200;
            opacity: 0.3;
        }

        /* Vignette */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 199;
        }

        /* FPS Counter */
        #fpsCounter {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-size: 16px;
            font-family: monospace;
            z-index: 300;
        }

        /* Debug Info */
        #debugInfo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #ffff00;
            font-size: 12px;
            font-family: monospace;
            z-index: 300;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        
        <!-- CRT Effects -->
        <div id="crtEffect"></div>
        <div id="vignette"></div>
        
        <!-- FPS Counter -->
        <div id="fpsCounter">FPS: 60</div>
        
        <!-- Debug Info -->
        <div id="debugInfo"></div>

        <!-- Splash Screen -->
        <div id="splashScreen" class="screen">
            <div id="splashLogo">FRIDAY NIGHT FUNKIN'</div>
            <div id="splashSubtitle">x АЛЯ - SPECIAL EDITION</div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="screen hidden">
            <div style="color: #fff; font-size: 32px;">ЗАГРУЗКА...</div>
            <div id="loadingBar">
                <div id="loadingFill"></div>
            </div>
            <div id="loadingText">0%</div>
        </div>

        <!-- Main Menu -->
        <div id="mainMenu" class="screen hidden">
            <div id="menuTitle">FRIDAY NIGHT<br>FUNKIN' x АЛЯ</div>
            <div class="menuButtons">
                <button class="menuButton selected" data-action="storyMode">ИСТОРИЯ</button>
                <button class="menuButton" data-action="freePlay">СВОБОДНАЯ ИГРА</button>
                <button class="menuButton" data-action="options">НАСТРОЙКИ</button>
                <button class="menuButton" data-action="credits">АВТОРЫ</button>
            </div>
            <div class="volumeControl">
                <span style="color: #fff;">🔊</span>
                <input type="range" class="volumeSlider" id="masterVolume" min="0" max="100" value="70">
            </div>
        </div>

        <!-- Story Mode Menu -->
        <div id="storyModeMenu" class="screen hidden">
            <div style="font-size: 48px; color: #ff1493; text-shadow: 0 0 30px #ff1493;">ВЫБЕРИТЕ ПЕСНЮ</div>
            <div class="songList" id="songList">
                <!-- Songs will be populated dynamically -->
            </div>
            <button class="menuButton" style="margin-top: 30px;" data-action="back">НАЗАД</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen hidden">
            <div id="scoreDisplay">Score: 0 | Misses: 0</div>
            <div id="comboDisplay">0 COMBO!</div>
            <div id="accuracyDisplay">Accuracy: 100%</div>
            
            <div id="healthBar">
                <div id="healthFill"></div>
                <div id="healthIcon"></div>
            </div>

            <!-- Strum Line (Player arrows) -->
            <div id="strumLine" style="position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px;">
                <div class="strumArrow" data-direction="0"></div>
                <div class="strumArrow" data-direction="1"></div>
                <div class="strumArrow" data-direction="2"></div>
                <div class="strumArrow" data-direction="3"></div>
            </div>

            <!-- Opponent strum line (visual only) -->
            <div id="opponentStrumLine" style="position: absolute; top: 50px; left: 50%; transform: translateX(-50%) scaleX(-1); display: flex; gap: 10px; opacity: 0.5;">
                <div class="strumArrow" data-direction="0"></div>
                <div class="strumArrow" data-direction="1"></div>
                <div class="strumArrow" data-direction="2"></div>
                <div class="strumArrow" data-direction="3"></div>
            </div>

            <div id="pauseOverlay" class="hidden">
                <div id="pauseTitle">ПАУЗА</div>
                <div class="pauseButtons">
                    <button class="pauseButton" data-action="resume">ПРОДОЛЖИТЬ</button>
                    <button class="pauseButton" data-action="retry">ЗАНОВО</button>
                    <button class="pauseButton" data-action="quit">В МЕНЮ</button>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen hidden">
            <div id="resultTitle">ПОБЕДА!</div>
            <div id="grade" class="grade-S">S</div>
            <div class="stats">
                <div class="statBox">
                    <div class="statLabel">ОЧКИ</div>
                    <div class="statValue" id="finalScore">0</div>
                </div>
                <div class="statBox">
                    <div class="statLabel">МАКС КОМБО</div>
                    <div class="statValue" id="finalCombo">0</div>
                </div>
                <div class="statBox">
                    <div class="statLabel">ТОЧНОСТЬ</div>
                    <div class="statValue" id="finalAccuracy">0%</div>
                </div>
                <div class="statBox">
                    <div class="statLabel">МИССОВ</div>
                    <div class="statValue" id="finalMisses">0</div>
                </div>
            </div>
            <div class="menuButtons">
                <button class="menuButton" data-action="continue">ПРОДОЛЖИТЬ</button>
                <button class="menuButton" data-action="retry">ЗАНОВО</button>
                <button class="menuButton" data-action="menu">В МЕНЮ</button>
            </div>
        </div>

        <!-- Settings Panel -->
        <div id="settingsPanel">
            <h2 style="color: #fff; text-align: center; margin-bottom: 30px;">НАСТРОЙКИ</h2>
            <div class="settingRow">
                <span class="settingLabel">Автосплей</span>
                <div class="settingToggle" id="autoplayToggle"></div>
            </div>
            <div class="settingRow">
                <span class="settingLabel">Правша</span>
                <div class="settingToggle" id="downscrollToggle"></div>
            </div>
            <div class="settingRow">
                <span class="settingLabel">CRT Эффект</span>
                <div class="settingToggle on" id="crtToggle"></div>
            </div>
            <div class="settingRow">
                <span class="settingLabel">Показать FPS</span>
                <div class="settingToggle on" id="fpsToggle"></div>
            </div>
            <button class="menuButton" data-action="closeSettings" style="margin-top: 30px; width: 100%;">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        // ============================================
        // ОСНОВНОЙ КЛАСС ИГРЫ - FridayNightFunkinAlya
        // ============================================
        class FridayNightFunkinAlya {
            constructor() {
                // Основные настройки игры
                this.TARGET_FPS = 60;
                this.SCROLL_SPEED = 5;
                this.HIT_WINDOW = {
                    SICK: 45,
                    GOOD: 90,
                    BAD: 135,
                    SHIT: 180
                };
                
                // Состояние игры
                this.currentState = 'SPLASH';
                this.previousState = null;
                this.isLoading = false;
                this.isPaused = false;
                this.isGameOver = false;
                
                // Настройки
                this.settings = {
                    autoplay: false,
                    downscroll: false,
                    crtEffect: true,
                    showFPS: true,
                    masterVolume: 0.7,
                    musicVolume: 0.8,
                    sfxVolume: 0.6
                };
                
                // Статистика
                this.stats = {
                    score: 0,
                    combo: 0,
                    maxCombo: 0,
                    misses: 0,
                    hits: { sick: 0, good: 0, bad: 0, shit: 0 },
                    totalNotes: 0,
                    accuracy: 100
                };
                
                // Здоровье
                this.health = 50;
                this.healthTarget = 50;
                
                // Время и аудио
                this.startTime = 0;
                this.audioTime = 0;
                this.audioDuration = 0;
                this.isPlaying = false;
                
                // Заметки (notes)
                this.notes = [];
                this.activeNotes = [];
                this.hitNotes = [];
                
                // Чарт песни
                this.currentChart = null;
                this.currentSong = null;
                
                // Ввод
                this.keysPressed = {};
                this.keyBindings = {
                    left: ['ArrowLeft', 'KeyA', 'KeyF'],
                    down: ['ArrowDown', 'KeyS', 'KeyY'],
                    up: ['ArrowUp', 'KeyW', 'KeyC'],
                    right: ['ArrowRight', 'KeyD', 'KeyV']
                };
                
                // Персонажи
                this.characters = {
                    boyfriend: null,
                    girlfriend: null,
                    opponent: null
                };
                
                // Анимации
                this.characterAnimations = {};
                this.particles = [];
                this.hitEffects = [];
                
                // Канвас и контекст
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                // Аудио контекст
                this.audioContext = null;
                this.musicSource = null;
                this.sounds = {};
                
                // Загруженные ресурсы
                this.loadedAssets = {};
                this.assetsToLoad = [];
                this.loadProgress = 0;
                
                // Камера и эффекты
                this.cameraShake = 0;
                this.screenFlash = null;
                this.zoom = 1;
                
                // FPS отслеживание
                this.frameCount = 0;
                this.lastFPSUpdate = 0;
                this.currentFPS = 60;
                
                // Инициализация
                this.init();
            }
            
            // ============================================
            // ИНИЦИАЛИЗАЦИЯ
            // ============================================
            async init() {
                console.log('🎵 Friday Night Funkin\' x Аля - Инициализация...');
                
                // Настройка обработчиков событий
                this.setupEventListeners();
                
                // Подготовка ресурсов
                this.prepareAssets();
                
                // Запуск цикла загрузки
                await this.loadAssets();
                
                // Запуск игрового цикла
                this.startGameLoop();
                
                console.log('✅ Игра готова!');
            }
            
            // ============================================
            // ОБРАБОТЧИКИ СОБЫТИЙ
            // ============================================
            setupEventListeners() {
                // Клавиатура
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
                document.addEventListener('keyup', (e) => this.handleKeyUp(e));
                
                // Мышь для кнопок меню
                document.querySelectorAll('.menuButton').forEach(button => {
                    button.addEventListener('click', (e) => this.handleMenuClick(e));
                    button.addEventListener('mouseenter', () => this.playSound('hover'));
                });
                
                // Ползунок громкости
                document.getElementById('masterVolume').addEventListener('input', (e) => {
                    this.settings.masterVolume = e.target.value / 100;
                    this.updateVolume();
                });
                
                // Настройки
                document.getElementById('autoplayToggle').addEventListener('click', () => {
                    this.settings.autoplay = !this.settings.autoplay;
                    document.getElementById('autoplayToggle').classList.toggle('on', this.settings.autoplay);
                });
                
                document.getElementById('downscrollToggle').addEventListener('click', () => {
                    this.settings.downscroll = !this.settings.downscroll;
                    document.getElementById('downscrollToggle').classList.toggle('on', this.settings.downscroll);
                });
                
                document.getElementById('crtToggle').addEventListener('click', () => {
                    this.settings.crtEffect = !this.settings.crtEffect;
                    document.getElementById('crtToggle').classList.toggle('on', this.settings.crtEffect);
                    document.getElementById('crtEffect').style.display = this.settings.crtEffect ? 'block' : 'none';
                });
                
                document.getElementById('fpsToggle').addEventListener('click', () => {
                    this.settings.showFPS = !this.settings.showFPS;
                    document.getElementById('fpsToggle').classList.toggle('on', this.settings.showFPS);
                    document.getElementById('fpsCounter').style.display = this.settings.showFPS ? 'block' : 'none';
                });
                
                // Кнопки паузы
                document.querySelectorAll('.pauseButton').forEach(button => {
                    button.addEventListener('click', (e) => this.handlePauseAction(e));
                });
                
                // Кнопки результатов
                document.querySelectorAll('#resultsScreen .menuButton').forEach(button => {
                    button.addEventListener('click', (e) => this.handleResultAction(e));
                });
                
                // Предотвращение стандартного поведения для игровых клавиш
                window.addEventListener('keydown', (e) => {
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                        e.preventDefault();
                    }
                });
            }
            
            // ============================================
            // ОБРАБОТКА ВВОДА
            // ============================================
            handleKeyDown(e) {
                if (this.keysPressed[e.code]) return;
                
                this.keysPressed[e.code] = true;
                
                // Обработка в игре
                if (this.currentState === 'GAME' && !this.isPaused) {
                    this.handleGameInput(e.code);
                }
                
                // Глобальные горячие клавиши
                if (e.code === 'Escape') {
                    if (this.currentState === 'GAME' && !this.isGameOver) {
                        this.togglePause();
                    } else if (this.currentState === 'PAUSE') {
                        this.resumeGame();
                    }
                }
                
                // Навигация в меню
                if (this.currentState === 'MENU' || this.currentState === 'STORY_MODE') {
                    this.handleMenuNavigation(e.code);
                }
            }
            
            handleKeyUp(e) {
                this.keysPressed[e.code] = false;
            }
            
            handleGameInput(keyCode) {
                const directions = ['left', 'down', 'up', 'right'];
                
                for (let i = 0; i < directions.length; i++) {
                    if (this.keyBindings[directions[i]].includes(keyCode)) {
                        this.hitNote(i);
                        this.animateStrum(i);
                        break;
                    }
                }
            }
            
            handleMenuClick(e) {
                const action = e.target.dataset.action;
                this.playSound('confirm');
                
                switch(action) {
                    case 'storyMode':
                        this.showStoryMode();
                        break;
                    case 'freePlay':
                        this.showMessage('СКОРО БУДЕТ ДОСТУПНО!');
                        break;
                    case 'options':
                        this.showSettings();
                        break;
                    case 'credits':
                        this.showMessage('РАЗРАБОТАНО ДЛЯ ФНФ x АЛЯ\nСПАСИБО ЗА ИГРУ!');
                        break;
                    case 'back':
                        this.showMainMenu();
                        break;
                }
            }
            
            handlePauseAction(e) {
                const action = e.target.dataset.action;
                this.playSound('confirm');
                
                switch(action) {
                    case 'resume':
                        this.resumeGame();
                        break;
                    case 'retry':
                        this.retrySong();
                        break;
                    case 'quit':
                        this.quitToMenu();
                        break;
                }
            }
            
            handleResultAction(e) {
                const action = e.target.dataset.action;
                this.playSound('confirm');
                
                switch(action) {
                    case 'continue':
                        this.nextSong();
                        break;
                    case 'retry':
                        this.retrySong();
                        break;
                    case 'menu':
                        this.quitToMenu();
                        break;
                }
            }
            
            handleMenuNavigation(keyCode) {
                // Реализация навигации стрелками
                const buttons = document.querySelectorAll(`#${this.currentState === 'MENU' ? 'mainMenu' : 'storyModeMenu'} .menuButton`);
                const selected = document.querySelector(`#${this.currentState === 'MENU' ? 'mainMenu' : 'storyModeMenu'} .menuButton.selected`);
                
                if (!selected) return;
                
                const currentIndex = Array.from(buttons).indexOf(selected);
                
                if (keyCode === 'ArrowUp' || keyCode === 'KeyW') {
                    const prevIndex = (currentIndex - 1 + buttons.length) % buttons.length;
                    selected.classList.remove('selected');
                    buttons[prevIndex].classList.add('selected');
                    this.playSound('hover');
                } else if (keyCode === 'ArrowDown' || keyCode === 'KeyS') {
                    const nextIndex = (currentIndex + 1) % buttons.length;
                    selected.classList.remove('selected');
                    buttons[nextIndex].classList.add('selected');
                    this.playSound('hover');
                } else if (keyCode === 'Enter' || keyCode === 'Space') {
                    selected.click();
                }
            }

            async loadAssets() {
                this.changeState('LOADING');
                
                const total = this.assetsToLoad.length;
                let loaded = 0;
                
                for (const asset of this.assetsToLoad) {
                    try {
                        await this.loadAsset(asset);
                        loaded++;
                        this.loadProgress = Math.round((loaded / total) * 100);
                        this.updateLoadingUI();
                    } catch (error) {
                        console.warn(`Не удалось загрузить ${asset.name}:`, error);
                        // Создаём заглушку
                        this.createPlaceholder(asset);
                    }
                }
                
                // Небольшая задержка перед показом меню
                await this.delay(500);
                this.showMainMenu();
            }
            
            loadAsset(asset) {
                return new Promise((resolve, reject) => {
                    if (asset.type === 'image') {
                        const img = new Image();
                        img.onload = () => {
                            this.loadedAssets[asset.name] = img;
                            resolve(img);
                        };
                        img.onerror = reject;
                        img.src = asset.path;
                    } else if (asset.type === 'audio') {
                        const audio = new Audio();
                        audio.oncanplaythrough = () => {
                            this.sounds[asset.name] = audio;
                            resolve(audio);
                        };
                        audio.onerror = reject;
                        audio.src = asset.path;
                        audio.load();
                    }
                });
            }
            
            createPlaceholder(asset) {
                if (asset.type === 'image') {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100;
                    canvas.height = 100;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#333';
                    ctx.fillRect(0, 0, 100, 100);
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(asset.name, 50, 50);
                    this.loadedAssets[asset.name] = canvas;
                }
            }
            
            updateLoadingUI() {
                document.getElementById('loadingFill').style.width = `${this.loadProgress}%`;
                document.getElementById('loadingText').textContent = `${this.loadProgress}%`;
            }
            
            // ============================================

            // ============================================
            // ИГРОВАЯ ЛОГИКА
            // ============================================
            startGame() {
                this.changeState('GAME');
                this.resetGameStats();
                this.generateChart();
                this.setupGameElements();
                this.startMusic();
                this.isPlaying = true;
                this.isPaused = false;
                this.isGameOver = false;
            }
            
            resetGameStats() {
                this.stats = {
                    score: 0,
                    combo: 0,
                    maxCombo: 0,
                    misses: 0,
                    hits: { sick: 0, good: 0, bad: 0, shit: 0 },
                    totalNotes: 0,
                    accuracy: 100
                };
                this.health = 50;
                this.healthTarget = 50;
                this.notes = [];
                this.activeNotes = [];
                this.hitNotes = [];
            }
            
            generateChart() {
                // Генерация чарта для Tutorial
                const bpm = 100;
                const beatDuration = 60 / bpm * 1000; // мс на бит
                const songDuration = 60000; // 1 минута
                
                let time = 1000; // Начинаем через 1 секунду
                
                while (time < songDuration) {
                    // Простой паттерн для примера
                    const pattern = [
                        [0],           // Left
                        [1],           // Down
                        [2],           // Up
                        [3],           // Right
                        [0, 2],        // Left + Up
                        [1, 3],        // Down + Right
                        [0, 1, 2, 3]   // All
                    ];
                    
                    const patternIndex = Math.floor(time / beatDuration) % pattern.length;
                    const directions = pattern[patternIndex];
                    
                    directions.forEach(dir => {
                        this.notes.push({
                            direction: dir,
                            time: time,
                            hit: false,
                            missed: false,
                            type: 'normal'
                        });
                    });
                    
                    time += beatDuration / 2; // Ноты каждые пол-бита
                }
                
                this.stats.totalNotes = this.notes.length;
                console.log(`📝 Сгенерировано ${this.notes.length} нот`);
            }
            
            setupGameElements() {
                // Установка стрелок
                const strumArrows = document.querySelectorAll('.strumArrow');
                const arrowNames = ['arrow_left', 'arrow_down', 'arrow_up', 'arrow_right'];
                
                strumArrows.forEach((arrow, index) => {
                    const img = this.loadedAssets[arrowNames[index]];
                    if (img) {
                        arrow.style.backgroundImage = `url('${img.src}')`;
                    } else {
                        // Цветные заглушки
                        const colors = ['#c24b99', '#00ffff', '#12fa05', '#f9393f'];
                        arrow.style.backgroundColor = colors[index];
                    }
                });
            }
            
            startMusic() {
                const music = this.sounds['tutorial'];
                if (music) {
                    music.currentTime = 0;
                    music.volume = this.settings.musicVolume * this.settings.masterVolume;
                    music.play().catch(e => console.log('Автовоспроизведение заблокировано:', e));
                    this.startTime = performance.now();
                    this.audioDuration = music.duration * 1000;
                } else {
                    // Если музыка не загружена, используем таймер
                    this.startTime = performance.now();
                    this.audioDuration = 60000;
                }
            }
            
            stopMusic() {
                Object.values(this.sounds).forEach(sound => {
                    sound.pause();
                    sound.currentTime = 0;
                });
            }
            
            togglePause() {
                if (this.isPaused) {
                    this.resumeGame();
                } else {
                    this.pauseGame();
                }
            }
            
            pauseGame() {
                this.isPaused = true;
                this.isPlaying = false;
                const music = this.sounds['tutorial'];
                if (music) music.pause();
                document.getElementById('pauseOverlay').classList.remove('hidden');
                this.changeState('PAUSE');
            }
            
            resumeGame() {
                this.isPaused = false;
                this.isPlaying = true;
                const music = this.sounds['tutorial'];
                if (music) music.play();
                document.getElementById('pauseOverlay').classList.add('hidden');
                this.changeState('GAME');
                this.startTime = performance.now() - this.audioTime;
            }
            
            retrySong() {
                document.getElementById('pauseOverlay').classList.add('hidden');
                document.getElementById('resultsScreen').classList.add('hidden');
                this.startGame();
            }
            
            quitToMenu() {
                this.stopMusic();
                document.getElementById('pauseOverlay').classList.add('hidden');
                document.getElementById('resultsScreen').classList.add('hidden');
                this.showMainMenu();
            }
            
            nextSong() {
                // Переход к следующей песне (пока просто рестарт)
                this.quitToMenu();
            }
            
            // ============================================
            // МЕХАНИКА ПОПАДАНИЙ
            // ============================================
            hitNote(direction) {
                if (this.isGameOver || this.isPaused) return;
                
                const currentTime = this.audioTime;
                
                // Поиск ближайшей ноты в этом направлении
                const hittableNote = this.notes.find(note => 
                    note.direction === direction && 
                    !note.hit && 
                    !note.missed &&
                    Math.abs(note.time - currentTime) <= this.HIT_WINDOW.SHIT
                );
                
                if (!hittableNote) {
                    // Промах (нажатие без ноты)
                    this.processHit(null, direction);
                    return;
                }
                
                const timeDiff = Math.abs(hittableNote.time - currentTime);
                let rating;
                
                if (timeDiff <= this.HIT_WINDOW.SICK) {
                    rating = 'sick';
                } else if (timeDiff <= this.HIT_WINDOW.GOOD) {
                    rating = 'good';
                } else if (timeDiff <= this.HIT_WINDOW.BAD) {
                    rating = 'bad';
                } else {
                    rating = 'shit';
                }
                
                hittableNote.hit = true;
                this.processHit(rating, direction);
            }
            
            processHit(rating, direction) {
                if (rating) {
                    // Попадание
                    const points = { sick: 350, good: 200, bad: 100, shit: 50 };
                    this.stats.score += points[rating];
                    this.stats.hits[rating]++;
                    this.stats.combo++;
                    this.stats.maxCombo = Math.max(this.stats.maxCombo, this.stats.combo);
                    
                    // Увеличение здоровья
                    const healthGain = { sick: 2.5, good: 1.5, bad: 0.5, shit: 0.2 };
                    this.healthTarget = Math.min(100, this.healthTarget + healthGain[rating]);
                    
                    // Создание эффектов
                    this.createHitEffect(direction);
                    this.showRating(rating);
                    this.playSound('hit');
                    
                    // Анимация персонажа
                    this.animateCharacter('boyfriend', direction);
                } else {
                    // Промах (нажатие без ноты)
                    this.stats.combo = 0;
                    this.healthTarget = Math.max(0, this.healthTarget - 1);
                    this.playSound('miss');
                }
                
                this.updateHUD();
            }
            
            missNote(note) {
                note.missed = true;
                this.stats.misses++;
                this.stats.combo = 0;
                this.healthTarget = Math.max(0, this.healthTarget - 5);
                this.playSound('miss');
                this.updateHUD();
                
                // Анимация промаха
                this.animateCharacter('boyfriend', note.direction + 4); // Miss animations
            }
            
            createHitEffect(direction) {
                const strumLine = document.getElementById('strumLine');
                const rect = strumLine.children[direction].getBoundingClientRect();
                
                const effect = document.createElement('div');
                effect.className = 'hitEffect';
                effect.style.left = `${rect.left}px`;
                effect.style.top = `${rect.top}px`;
                document.body.appendChild(effect);
                
                setTimeout(() => effect.remove(), 200);
            }
            
            showRating(rating) {
                const strumLine = document.getElementById('strumLine');
                const ratingText = document.createElement('div');
                ratingText.className = `ratingText rating-${rating}`;
                ratingText.textContent = rating.toUpperCase();
                ratingText.style.left = '50%';
                ratingText.style.top = '100px';
                ratingText.style.transform = 'translateX(-50%)';
                document.getElementById('gameScreen').appendChild(ratingText);
                
                setTimeout(() => ratingText.remove(), 500);
            }
            
            animateStrum(direction) {
                const strumArrow = document.querySelector(`.strumArrow[data-direction="${direction}"]`);
                if (strumArrow) {
                    strumArrow.style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        strumArrow.style.transform = 'scale(1)';
                    }, 100);
                }
            }
            
            animateCharacter(character, animation) {
                // Реализация анимации персонажа
                const charElement = document.getElementById(character);
                if (charElement) {
                    const img = this.loadedAssets[`${character}_${animation}`];
                    if (img) {
                        charElement.style.backgroundImage = `url('${img.src}')`;
                    }
                }
            }
            
            // ============================================
            // ОБНОВЛЕНИЕ HUD
            // ============================================
            updateHUD() {
                // Обновление счёта
                document.getElementById('scoreDisplay').textContent = 
                    `Score: ${this.stats.score.toLocaleString()} | Misses: ${this.stats.misses}`;
                
                // Обновление комбо
                const comboDisplay = document.getElementById('comboDisplay');
                if (this.stats.combo > 5) {
                    comboDisplay.textContent = `${this.stats.combo} COMBO!`;
                    comboDisplay.classList.add('visible');
                } else {
                    comboDisplay.classList.remove('visible');
                }
                
                // Обновление точности
                this.calculateAccuracy();
                document.getElementById('accuracyDisplay').textContent = 
                    `Accuracy: ${this.stats.accuracy.toFixed(2)}%`;
                
                // Обновление здоровья
                this.health = this.health + (this.healthTarget - this.health) * 0.1;
                const healthFill = document.getElementById('healthFill');
                const healthIcon = document.getElementById('healthIcon');
                healthFill.style.width = `${this.health}%`;
                healthIcon.style.left = `${this.health}%`;
                
                // Проверка проигрыша
                if (this.health <= 0 && !this.isGameOver) {
                    this.gameOver();
                }
            }
            
            calculateAccuracy() {
                const totalHits = Object.values(this.stats.hits).reduce((a, b) => a + b, 0);
                if (totalHits + this.stats.misses > 0) {
                    const weightedHits = 
                        this.stats.hits.sick * 1 +
                        this.stats.hits.good * 0.8 +
                        this.stats.hits.bad * 0.5 +
                        this.stats.hits.shit * 0.2;
                    this.stats.accuracy = (weightedHits / (totalHits + this.stats.misses)) * 100;
                }
            }
            
            // ============================================
            // КОНЕЦ ИГРЫ
            // ============================================
            gameOver() {
                this.isGameOver = true;
                this.isPlaying = false;
                this.stopMusic();
                this.playSound('gameover');
                
                setTimeout(() => {
                    this.showResults(false);
                }, 1500);
            }
            
            songComplete() {
                this.isPlaying = false;
                this.stopMusic();
                this.showResults(true);
            }
            
            showResults(victory) {
                this.changeState('RESULTS');
                
                const resultTitle = document.getElementById('resultTitle');
                const grade = document.getElementById('grade');
                
                if (victory) {
                    resultTitle.textContent = 'ПОБЕДА!';
                    resultTitle.className = 'win';
                    
                    // Определение оценки
                    if (this.stats.accuracy >= 95) grade.textContent = 'S';
                    else if (this.stats.accuracy >= 90) grade.textContent = 'A';
                    else if (this.stats.accuracy >= 80) grade.textContent = 'B';
                    else if (this.stats.accuracy >= 70) grade.textContent = 'C';
                    else if (this.stats.accuracy >= 60) grade.textContent = 'D';
                    else grade.textContent = 'F';
                    
                    grade.className = `grade-${grade.textContent}`;
                    this.playSound('win');
                } else {
                    resultTitle.textContent = 'ПОРАЖЕНИЕ...';
                    resultTitle.className = 'lose';
                    grade.textContent = 'F';
                    grade.className = 'grade-F';
                }
                
                // Заполнение статистики
                document.getElementById('finalScore').textContent = this.stats.score.toLocaleString();
                document.getElementById('finalCombo').textContent = this.stats.maxCombo;
                document.getElementById('finalAccuracy').textContent = `${this.stats.accuracy.toFixed(2)}%`;
                document.getElementById('finalMisses').textContent = this.stats.misses;
            }
            
            // ============================================
            // ИГРОВОЙ ЦИКЛ
            // ============================================
            startGameLoop() {
                let lastTime = performance.now();
                let accumulator = 0;
                const frameTime = 1000 / this.TARGET_FPS;
                
                const gameLoop = (currentTime) => {
                    requestAnimationFrame(gameLoop);
                    
                    const deltaTime = currentTime - lastTime;
                    lastTime = currentTime;
                    
                    // Обновление FPS
                    this.frameCount++;
                    if (currentTime - this.lastFPSUpdate >= 1000) {
                        this.currentFPS = this.frameCount;
                        this.frameCount = 0;
                        this.lastFPSUpdate = currentTime;
                        
                        if (this.settings.showFPS) {
                            document.getElementById('fpsCounter').textContent = `FPS: ${this.currentFPS}`;
                        }
                    }
                    
                    // Обновление времени аудио
                    if (this.isPlaying && !this.isPaused) {
                        this.audioTime = performance.now() - this.startTime;
                        
                        // Проверка конца песни
                        if (this.audioTime >= this.audioDuration) {
                            this.songComplete();
                        }
                    }
                    
                    // Обновление логики игры
                    this.update(deltaTime);
                    
                    // Рендеринг
                    this.render();
                };
                
                requestAnimationFrame(gameLoop);
            }
            
            update(deltaTime) {
                // Обновление активных нот
                this.updateNotes();
                
                // Обновление частиц
                this.updateParticles(deltaTime);
                
                // Обновление камеры
                this.updateCamera();
                
                // Автоплей
                if (this.settings.autoplay && this.isPlaying) {
                    this.autoPlayNotes();
                }
                
                // Отладочная информация
                if (this.settings.showFPS) {
                    document.getElementById('debugInfo').innerHTML = `
                        Notes: ${this.notes.length}<br>
                        Active: ${this.activeNotes.length}<br>
                        Time: ${Math.floor(this.audioTime / 1000)}s<br>
                        Health: ${this.health.toFixed(1)}%
                    `;
                }
            }
            
            updateNotes() {
                if (!this.isPlaying) return;
                
                const hitPosition = this.settings.downscroll ? 150 : 570; // Y-позиция линии скролла
                const scrollSpeed = this.SCROLL_SPEED * (60 / this.TARGET_FPS);
                
                // Проверка на промахи
                this.notes.forEach(note => {
                    if (!note.hit && !note.missed && note.time < this.audioTime - this.HIT_WINDOW.SHIT) {
                        this.missNote(note);
                    }
                });
                
                // Фильтрация активных нот для рендеринга
                this.activeNotes = this.notes.filter(note => {
                    if (note.hit || note.missed) return false;
                    
                    const timeDiff = note.time - this.audioTime;
                    const yPosition = this.settings.downscroll 
                        ? hitPosition - (timeDiff / 1000 * scrollSpeed * 60)
                        : hitPosition + (timeDiff / 1000 * scrollSpeed * 60);
                    
                    return yPosition > -100 && yPosition < 820;
                });
            }
            
            autoPlayNotes() {
                this.notes.forEach(note => {
                    if (!note.hit && !note.missed) {
                        const timeDiff = Math.abs(note.time - this.audioTime);
                        if (timeDiff < 50 && timeDiff > 0) {
                            // Автоматическое попадание
                            note.hit = true;
                            this.stats.score += 350;
                            this.stats.hits.sick++;
                            this.stats.combo++;
                            this.stats.maxCombo = Math.max(this.stats.maxCombo, this.stats.combo);
                            this.healthTarget = Math.min(100, this.healthTarget + 2.5);
                            this.updateHUD();
                        }
                    }
                });
            }
            
            updateParticles(deltaTime) {
                this.particles.forEach((particle, index) => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.life -= deltaTime;
                    particle.alpha = particle.life / particle.maxLife;
                    
                    if (particle.life <= 0) {
                        this.particles.splice(index, 1);
                    }
                });
            }
            
            updateCamera() {
                // Тряска камеры при сильных басах
                if (this.cameraShake > 0) {
                    this.cameraShake -= 0.5;
                }
            }
            
            render() {
                // Очистка канваса
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Применение тряски камеры
                this.ctx.save();
                if (this.cameraShake > 0) {
                    const shakeX = (Math.random() - 0.5) * this.cameraShake;
                    const shakeY = (Math.random() - 0.5) * this.cameraShake;
                    this.ctx.translate(shakeX, shakeY);
                }
                
                // Рендеринг фона
                this.renderBackground();
                
                // Рендеринг персонажей
                this.renderCharacters();
                
                // Рендеринг нот
                this.renderNotes();
                
                // Рендеринг частиц
                this.renderParticles();
                
                this.ctx.restore();
            }
            
            renderBackground() {
                const stage = this.loadedAssets['stage'];
                if (stage) {
                    this.ctx.drawImage(stage, 0, 0, this.canvas.width, this.canvas.height);
                } else {
                    // Градиентный фон по умолчанию
                    const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                    gradient.addColorStop(0, '#1a1a2e');
                    gradient.addColorStop(1, '#16213e');
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }
            
            renderCharacters() {
                // Рендеринг БФ
                const bf = this.loadedAssets['bf_idle'];
                if (bf) {
                    this.ctx.drawImage(bf, 100, 320, 300, 400);
                }
                
                // Рендеринг ГФ
                const gf = this.loadedAssets['gf_idle'];
                if (gf) {
                    this.ctx.drawImage(gf, 490, 370, 250, 350);
                }
            }
            
            renderNotes() {
                const hitPosition = this.settings.downscroll ? 150 : 570;
                const scrollSpeed = this.SCROLL_SPEED * (60 / this.TARGET_FPS);
                const arrowNames = ['arrow_left', 'arrow_down', 'arrow_up', 'arrow_right'];
                const laneWidth = 70;
                const centerX = this.canvas.width / 2;
                const startX = centerX - (laneWidth * 1.5);
                
                this.activeNotes.forEach(note => {
                    const timeDiff = note.time - this.audioTime;
                    const y = this.settings.downscroll 
                        ? hitPosition - (timeDiff / 1000 * scrollSpeed * 60)
                        : hitPosition + (timeDiff / 1000 * scrollSpeed * 60);
                    
                    const x = startX + (note.direction * laneWidth);
                    
                    const arrow = this.loadedAssets[arrowNames[note.direction]];
                    if (arrow) {
                        this.ctx.drawImage(arrow, x, y, 60, 60);
                    } else {
                        // Цветная заглушка
                        const colors = ['#c24b99', '#00ffff', '#12fa05', '#f9393f'];
                        this.ctx.fillStyle = colors[note.direction];
                        this.ctx.beginPath();
                        this.ctx.moveTo(x + 30, y);
                        this.ctx.lineTo(x + 60, y + 30);
                        this.ctx.lineTo(x + 30, y + 60);
                        this.ctx.lineTo(x, y + 30);
                        this.ctx.fill();
                    }
                });
            }
            
            renderParticles() {
                this.particles.forEach(particle => {
                    this.ctx.globalAlpha = particle.alpha;
                    this.ctx.fillStyle = particle.color;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                this.ctx.globalAlpha = 1;
            }
            
            // ============================================
            // АУДИО СИСТЕМА
            // ============================================
            playSound(soundName) {
                const sound = this.sounds[soundName];
                if (sound) {
                    sound.currentTime = 0;
                    sound.volume = this.settings.sfxVolume * this.settings.masterVolume;
                    sound.play().catch(e => {});
                }
            }
            
            playMusic(musicName, loop = false) {
                this.stopMusic();
                
                const music = this.sounds[musicName];
                if (music) {
                    music.loop = loop;
                    music.volume = this.settings.musicVolume * this.settings.masterVolume;
                    music.play().catch(e => {});
                }
            }
            
            updateVolume() {
                Object.values(this.sounds).forEach(sound => {
                    sound.volume = sound.loop ? 
                        this.settings.musicVolume * this.settings.masterVolume :
                        this.settings.sfxVolume * this.settings.masterVolume;
                });
            }
            
            // ============================================
            // ВСПОМОГАТЕЛЬНЫЕ МЕТОДЫ
            // ============================================
            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
            
            spawnParticle(x, y, color, count = 10) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        size: Math.random() * 5 + 2,
                        color: color,
                        life: 1000,
                        maxLife: 1000,
                        alpha: 1
                    });
                }
            }
        }
        
        // ============================================
        // ЗАПУСК ИГРЫ
        // ============================================
        window.addEventListener('load', () => {
            window.game = new FridayNightFunkinAlya();
        });
    </script>
